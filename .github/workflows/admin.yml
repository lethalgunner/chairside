name: Admin

# Run by hand from GitHub → Actions → Admin → "Run workflow".
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL_MIGRATE  Supabase *session pooler* connection string (IPv4, port 5432)
#   APP_URL               The live app address, e.g. https://chairside.vercel.app
# Invite links appear in the run's Summary. They work once, for 72 hours.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [migrate, seed, invite]
        default: invite
      seed_file:
        description: "seed: which file"
        default: seed/pilot0.json
      org:
        description: "invite: organisation name exactly as seeded"
        default: Dr. Vij Dental Clinic & Implant Center
      email:
        description: "invite: the person's email"
      name:
        description: "invite: their name (leave blank with link_doctor)"
      link_doctor:
        description: "invite: existing doctor name to give a login, e.g. Dr. Anshul Vij"
      roles:
        description: "invite: roles, space-separated (owner, branch_manager, front_desk, doctor, accountant…)"
        default: front_desk
      branch:
        description: "invite: branch code (KNP, PUN); blank = all branches"

concurrency: admin

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}
      DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the database secret (never printed)
        run: |
          node -e '
            const raw = process.env.DATABASE_URL || "";
            const fail = (m) => { console.log("::error::" + m); process.exit(1); };
            if (!raw) fail("Secret DATABASE_URL_MIGRATE is missing. Add it under Settings → Secrets and variables → Actions.");
            if (/\[YOUR-PASSWORD\]|\s/.test(raw)) fail("DATABASE_URL_MIGRATE still contains [YOUR-PASSWORD] or a space/newline. Paste the string again with your real password.");
            let u; try { u = new URL(raw); } catch { fail("DATABASE_URL_MIGRATE is not a valid URL. If your password has symbols like @ # / ? %, reset it to letters and digits only."); }
            if (!/^postgres(ql)?:$/.test(u.protocol)) fail("DATABASE_URL_MIGRATE must start with postgresql://");
            if (!u.hostname.includes("pooler.supabase.com")) fail("Use the Session pooler string (host ends in pooler.supabase.com), not the Direct connection.");
            if (u.port !== "5432") fail("Use the Session pooler on port 5432 for admin tasks (6543 is for the app).");
            if (!u.username.startsWith("postgres.")) fail("The user should look like postgres.<project-ref>.");
            console.log("Database secret looks right: " + u.username.replace(/\..*/, ".***") + "@" + u.hostname + ":" + u.port);
          '
      - run: npm ci
      - name: Migrate
        if: inputs.task == 'migrate'
        run: npm run db:migrate
      - name: Seed
        if: inputs.task == 'seed'
        run: npm run seed -- "${{ inputs.seed_file }}"
      - name: Invite
        if: inputs.task == 'invite'
        env:
          ORG: ${{ inputs.org }}
          EMAIL: ${{ inputs.email }}
          NAME: ${{ inputs.name }}
          LINK_DOCTOR: ${{ inputs.link_doctor }}
          ROLES: ${{ inputs.roles }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$EMAIL" ]; then echo "::error::Fill in 'invite: the person's email'."; exit 1; fi
          if [ -z "$NAME" ] && [ -z "$LINK_DOCTOR" ]; then echo "::error::Fill in their name (or an existing doctor's name under link_doctor)."; exit 1; fi
          if [ -z "$APP_URL" ]; then echo "::error::Secret APP_URL is missing, e.g. https://chairside.vercel.app"; exit 1; fi
          args=(--invite --org "$ORG" --email "$EMAIL")
          if [ -n "$LINK_DOCTOR" ]; then args+=(--link-doctor "$LINK_DOCTOR"); else args+=(--name "$NAME"); fi
          for r in $ROLES; do args+=(--role "$r"); done
          if [ -n "$BRANCH" ]; then args+=(--branch "$BRANCH"); fi
          npx tsx scripts/add-user.ts "${args[@]}"
